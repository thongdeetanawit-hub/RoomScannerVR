name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android Project Files
      run: |
        mkdir -p app/src/main/java/com/roomscanner/vr
        mkdir -p app/src/main/res/mipmap-hdpi
        
        # Manifest
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.roomscanner.vr">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.CAMERA" />
            <application
                android:allowBackup="true"
                android:label="RoomScannerVR"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/roomscanner/vr/MainActivity.kt
        package com.roomscanner.vr
        import android.os.Bundle
        import android.webkit.WebView
        import android.webkit.WebViewClient
        import android.app.Activity

        class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val webView = WebView(this)
                webView.settings.javaScriptEnabled = true
                webView.settings.domStorageEnabled = true
                webView.webViewClient = WebViewClient()
                webView.loadUrl("https://immersiveweb.dev")
                setContentView(webView)
            }
        }
        EOF

        # root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.21'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # settings.gradle
        cat << 'EOF' > settings.gradle
        rootProject.name = "RoomScannerVR"
        include ':app'
        EOF

        # app/build.gradle
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            namespace 'com.roomscanner.vr'
            compileSdk 33

            defaultConfig {
                applicationId "com.roomscanner.vr"
                minSdk 26
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.10.1'
        }
        EOF

    - name: Setup Gradle Wrapper
      run: gradle wrapper --gradle-version 8.0.2

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RoomScannerVR-APK
        path: app/build/outputs/apk/debug/app-debug.apk
